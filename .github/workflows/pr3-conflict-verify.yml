name: Verify PR3 conflict resolution
on:
  push:
    branches: [automation/pr3-conflict-resolution-20260917]
    paths:
      - .github/pr3-resolution/**
      - .github/workflows/pr3-conflict-verify.yml
permissions:
  contents: read
concurrency:
  group: pr3-conflict-resolution
  cancel-in-progress: false
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: work
    steps:
      - name: Preserve source bytes
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: staging
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 17856c7210d493ef6e7b670397596dcc70cca65d
          path: work
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - name: Reconstruct exact locally verified merge
        run: python ../staging/.github/pr3-resolution/apply_resolution.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.15.0'
      - name: Frontend installation, types and build
        shell: python
        run: |
          import os, pathlib, subprocess
          for name, args in [('ci',['ci','--include=dev']),('types',['run','typecheck']),('build',['run','build'])]:
              result = subprocess.run(['npm.cmd', *args], stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              pathlib.Path(os.environ['RUNNER_TEMP'], 'merge-npm-' + name + '.log').write_bytes(result.stdout)
              print(result.stdout.decode('utf-8', errors='replace')[-4000:])
              if result.returncode:
                  raise SystemExit(result.returncode)
      - run: python -m pip install --require-hashes -r requirements-lock.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: ruff check .
      - run: mypy uga apps
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - run: cargo fmt --all --check
        working-directory: work/native
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        working-directory: work/native
      - name: Native workspace tests
        working-directory: work/native
        shell: python
        run: |
          import os, pathlib, subprocess
          result = subprocess.run(['cargo','test','--workspace','--locked'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          pathlib.Path(os.environ['RUNNER_TEMP'], 'merge-rust-tests.log').write_bytes(result.stdout)
          print(result.stdout.decode('utf-8', errors='replace')[-10000:])
          raise SystemExit(result.returncode)
      - run: cargo build -p uga-capture --release --locked
        working-directory: work/native
      - name: Require merged revision's native DLL
        run: |
          $dll = (Resolve-Path -LiteralPath native/target/release/uga_capture.dll).Path
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $dll).Hash.ToLowerInvariant()
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "UGA_NATIVE_CAPTURE_DLL=$dll"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "UGA_NATIVE_CAPTURE_SHA256=$sha"
      - name: Complete Python regression with native integration
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          result = subprocess.run([sys.executable, '-m', 'pytest', '-q', '-ra', '--junitxml=' + str(root / 'merge-tests.xml')], stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          (root / 'merge-pytest.log').write_bytes(result.stdout)
          print(result.stdout.decode('utf-8', errors='replace')[-16000:])
          raise SystemExit(result.returncode)
      - run: python -m apps.agent
      - run: python -m apps.example_game --headless-smoke
      - run: python -m apps.benchmark validate-config configs/benchmarks/uga-bench-smoke.yaml
      - run: python -m apps.dependency_inventory --require-known --output build/dependency-inventory.json
      - run: python -m build --no-isolation
      - name: Save exact-revision validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr3-merge-verification
          path: ${{ runner.temp }}/merge-*
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    defaults:
      run:
        working-directory: work
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: staging
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 17856c7210d493ef6e7b670397596dcc70cca65d
          path: work
          fetch-depth: 0
          persist-credentials: false
      - name: Reconstruct verified merge without executing repository code
        run: python ../staging/.github/pr3-resolution/apply_resolution.py
      - name: Publish only the verified candidate; leave PR and main untouched
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, os, subprocess
          main = '17856c7210d493ef6e7b670397596dcc70cca65d'
          old = 'a51ff89cda0e31f19ba972ed0f78e9a58dd803fb'
          pr = 'refs/heads/fix/runtime-completion-20260917'
          candidate = 'refs/heads/automation/pr3-verified-resolution-20260917'
          env = dict(os.environ)
          auth = base64.b64encode(('x-access-token:' + env.pop('GH_TOKEN')).encode()).decode()
          env.update(GIT_CONFIG_COUNT='1', GIT_CONFIG_KEY_0='http.https://github.com/.extraheader', GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + auth)
          refs = subprocess.check_output(['git','ls-remote','origin','refs/heads/main',pr,candidate], env=env, text=True)
          tips = {line.split()[1]: line.split()[0] for line in refs.splitlines()}
          assert tips.get('refs/heads/main') == main, 'main advanced: reconcile again'
          assert tips.get(pr) == old, 'PR advanced: refusing to overwrite'
          assert tips.get(candidate) == old, 'candidate advanced: refusing to overwrite'
          subprocess.run(['git','push','origin','HEAD:' + candidate], env=env, check=True)
          print('Published verified merge 8ba3549a072407be94a43013c6c47db99cc79389')
