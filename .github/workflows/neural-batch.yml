name: Verify neural development batch
on:
  push:
    branches: [automation/neural-training-20260917]
    paths:
      - .github/neural-delivery/**
      - .github/workflows/neural-batch.yml
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUTF8: '1'
    defaults:
      run:
        working-directory: work
    steps:
      - name: Preserve source bytes
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: staging
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f279eea822b3f04f96fbca5dc3f5d6234607c3da
          path: work
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - name: Restore exact reviewed commits
        run: python ../staging/.github/neural-delivery/apply.py
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        if: runner.os == 'Windows'
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: runner.os == 'Windows'
        with:
          node-version: '24.15.0'
      - name: Full exact-tree validation including real neural tests
        run: python ../staging/.github/neural-delivery/validate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: neural-batch-${{ runner.os }}-evidence
          path: ${{ runner.temp }}/neural-evidence
          retention-days: 7
          if-no-files-found: error
  publish-objects:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    defaults:
      run:
        working-directory: work
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: staging
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f279eea822b3f04f96fbca5dc3f5d6234607c3da
          path: work
          persist-credentials: false
      - name: Restore reviewed objects without executing repository code
        run: python ../staging/.github/neural-delivery/apply.py
      - name: Publish verified Git objects without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ../staging/.github/neural-delivery/publish.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: neural-batch-published-objects
          path: ${{ runner.temp }}/neural-published
          retention-days: 7
          if-no-files-found: error
