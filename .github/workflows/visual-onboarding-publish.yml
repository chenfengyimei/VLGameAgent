name: Publish visual onboarding branch
'on':
  push:
    branches:
      - automation/visual-onboarding-publish-20260918
    paths:
      - .github/workflows/visual-onboarding-publish.yml
permissions:
  contents: write
  pull-requests: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ce18180f8a4d73760e018793e9a35539b025fc83
          fetch-depth: 0
      - name: Restore and push reviewed onboarding branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAYLOAD_BLOB: 63d8d8c0fafd6e2cb7dd350d520d96d45d267a99
          EXPECTED_BASE: ce18180f8a4d73760e018793e9a35539b025fc83
          EXPECTED_HEAD: d54921a69df356ad2e4afcf0aba0cbe38a6430b1
          TARGET_BRANCH: feat/visual-onboarding-20260918
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          gh api "/repos/${GITHUB_REPOSITORY}/git/blobs/${PAYLOAD_BLOB}" --jq .content | base64 -d > payload.text
          base64 -d payload.text > payload.xz
          xz -d -c payload.xz > payload.bin
          if git bundle verify payload.bin >/tmp/bundle.verify 2>&1; then
            git fetch payload.bin "$EXPECTED_HEAD"
            git checkout -B "$TARGET_BRANCH" "$EXPECTED_HEAD"
          else
            git checkout -B "$TARGET_BRANCH" "$EXPECTED_BASE"
            if grep -q '^diff --git ' payload.bin; then
              git apply --binary payload.bin
            elif unzip -t payload.bin >/tmp/zip.verify 2>&1; then
              mkdir restored
              unzip -q payload.bin -d restored
              if [ -d restored/VLGameAgent ]; then
                rsync -a --delete --exclude .git restored/VLGameAgent/ ./
              else
                rsync -a --delete --exclude .git restored/ ./
              fi
            else
              echo 'Unknown onboarding payload format' >&2
              cat /tmp/bundle.verify >&2 || true
              exit 1
            fi
            git add -A
            git -c user.name='automation' -c user.email='automation@users.noreply.github.com' commit -m 'feat(onboarding): add visual install assistant and Chinese guides'
          fi
          git log --oneline --decorate -6
          git push --force-with-lease origin "HEAD:refs/heads/${TARGET_BRANCH}"
      - name: Create or update PR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: feat/visual-onboarding-20260918
        run: |
          set -euo pipefail
          cat > body.md <<'EOF'
          改善安装、首次启动、环境自检、可视化配置和中文教程。

          主要内容：
          - 新增 `install.cmd`、`start.cmd`、`check.cmd`。
          - 新增 `uga-setup` / `uga-doctor` 与本地 Tk 启动助手。
          - 新增离线诊断、确认后才运行的启动计划，API Key 不写入配置。
          - 新增中文首次使用、配置说明、故障排查和离线图文帮助。
          - 更新旧教程，明确提示词禁止操作不等于零输入模式。

          已恢复本地验证：Linux/Python 3.13.5 便携回归 `866 passed, 309 subtests passed`；助手专项 `40 passed, 52 subtests passed`；Ruff 通过；mypy Windows 目标平台 211 源文件通过。

          未完成：Windows 干净环境安装、OCR 安装、远端 CI、真实模型与真实游戏验证。
          EOF
          if gh pr view "$TARGET_BRANCH" --json number >/tmp/pr.json 2>/dev/null; then
            number=$(python -c "import json; print(json.load(open('/tmp/pr.json'))['number'])")
            gh pr edit "$number" --title 'feat(onboarding): 增加可视化安装助手与中文首次使用教程' --body-file body.md
          else
            gh pr create --base main --head "$TARGET_BRANCH" --title 'feat(onboarding): 增加可视化安装助手与中文首次使用教程' --body-file body.md
          fi
