name: Recover runtime workspace
on:
  push:
    branches: [automation/runtime-completion-20260917]
    paths: [.github/workflows/recover-runtime-workspace.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-recovery-prefix
          path: .github/review-completion/part-0.b64
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
