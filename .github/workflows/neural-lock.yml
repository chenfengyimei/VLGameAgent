name: Resolve neural CPU lock
on:
  push:
    branches: [automation/neural-training-20260917]
    paths: [.github/workflows/neural-lock.yml]
permissions:
  contents: read
jobs:
  lock:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - name: Download pinned CPU wheel and its dependencies without execution
        run: python -m pip download --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu torch==2.10.0 --dest wheels
      - name: Hash every selected wheel
        shell: python
        run: |
          import hashlib, pathlib, zipfile, email, sys, platform
          rows = ['# Generated for CPython 3.11.9 ' + platform.system(), '--index-url https://download.pytorch.org/whl/cpu']
          for wheel in sorted(pathlib.Path('wheels').glob('*.whl')):
              with zipfile.ZipFile(wheel) as z:
                  names = [n for n in z.namelist() if n.endswith('.dist-info/METADATA')]
                  assert len(names) == 1
                  m = email.message_from_bytes(z.read(names[0]))
              h = hashlib.file_digest(wheel.open('rb'), 'sha256').hexdigest()
              rows.append(m['Name'] + '==' + m['Version'] + ' --hash=sha256:' + h)
          pathlib.Path('requirements-neural-cpu-' + sys.platform + '.txt').write_text('\n'.join(rows) + '\n')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: neural-cpu-lock-${{ matrix.os }}
          path: requirements-neural-cpu-*.txt
          retention-days: 7
          if-no-files-found: error
