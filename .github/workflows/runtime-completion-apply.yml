name: Verify and publish runtime completion
on:
  push:
    branches: [automation/runtime-completion-20260917]
    paths:
      - .github/workflows/runtime-completion-apply.yml
      - .github/review-completion/**
permissions:
  contents: read
concurrency:
  group: runtime-completion-publication
  cancel-in-progress: false
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: work
    steps:
      - name: Preserve source bytes
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: staging
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c4af90632865b4d8e758d6eabc84bd410ada38aa
          path: work
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - name: Verify exact per-module trees
        run: python ../staging/.github/review-completion/apply_series.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.15.0'
      - name: Verify npm installation and TypeScript with captured diagnostics
        shell: python
        run: |
          import os, pathlib, shutil, subprocess
          npm = shutil.which('npm.cmd')
          assert npm, 'Node setup did not provide npm.cmd'
          log = pathlib.Path(os.environ['RUNNER_TEMP']) / 'runtime-ui-validation.txt'
          for args in [('ci', '--include=dev', '--loglevel=verbose'), ('run', 'typecheck'), ('run', 'build')]:
              result = subprocess.run([npm, *args], capture_output=True, text=True, errors='replace', timeout=180)
              output = f'COMMAND: {npm} {args}; EXIT={result.returncode}\n' + result.stdout + result.stderr
              print(output)
              with log.open('a', encoding='utf-8') as handle:
                  handle.write(output)
              result.check_returncode()
      - run: python -m pip install --require-hashes -r requirements-lock.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: ruff check .
      - run: mypy uga apps
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - run: cargo fmt --all --check
        working-directory: work/native
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        working-directory: work/native
      - run: cargo test --workspace --locked
        working-directory: work/native
      - run: cargo build -p uga-capture --release --locked
        working-directory: work/native
      - name: Require this revision's DLL
        run: |
          $dll = (Resolve-Path -LiteralPath native/target/release/uga_capture.dll).Path
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $dll).Hash.ToLowerInvariant()
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "UGA_NATIVE_CAPTURE_DLL=$dll"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "UGA_NATIVE_CAPTURE_SHA256=$sha"
      - name: Full Python regression
        run: pytest -q -ra --junitxml="$env:RUNNER_TEMP/runtime-tests.xml"
      - run: python -m apps.agent
      - run: python -m apps.example_game --headless-smoke
      - run: python -m apps.benchmark validate-config configs/benchmarks/uga-bench-smoke.yaml
      - run: python -m apps.dependency_inventory --require-known --output build/dependency-inventory.json
      - run: python -m build --no-isolation
      - name: Export verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-verified-module-ledger
          path: |
            ${{ runner.temp }}/runtime-module-ledger.json
            ${{ runner.temp }}/runtime-tests.xml
            ${{ runner.temp }}/runtime-ui-validation.txt
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    defaults:
      run:
        working-directory: work
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: staging
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c4af90632865b4d8e758d6eabc84bd410ada38aa
          path: work
          persist-credentials: false
      - name: Apply verified modules without running repository code
        run: python ../staging/.github/review-completion/apply_series.py
      - name: Publish only by fast-forward to the isolated repair branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, os, subprocess
          base = 'c4af90632865b4d8e758d6eabc84bd410ada38aa'
          branch = 'refs/heads/fix/runtime-completion-20260917'
          env = dict(os.environ)
          secret = base64.b64encode(('x-access-token:' + env.pop('GH_TOKEN')).encode()).decode()
          env.update(GIT_CONFIG_COUNT='1', GIT_CONFIG_KEY_0='http.https://github.com/.extraheader', GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + secret)
          refs = subprocess.check_output(['git', 'ls-remote', 'origin', 'refs/heads/main', branch], env=env, text=True)
          tips = {line.split()[1]: line.split()[0] for line in refs.splitlines()}
          assert tips.get('refs/heads/main') == base, 'main changed: refusing stale publication'
          assert tips.get(branch) == base, 'repair branch changed: refusing overwrite'
          subprocess.run(['git', 'push', 'origin', 'HEAD:' + branch], env=env, check=True)
          print('Published module tip:')
          subprocess.run(['git', 'log', '-12', '--oneline'], check=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-published-module-ledger
          path: ${{ runner.temp }}/runtime-module-ledger.json
          retention-days: 7
          if-no-files-found: error
