name: Publish pinned GUI closed-loop commits
on:
  push:
    branches: [automation/gui-pr-publication-20260918]
    paths: [.github/workflows/gui-pr-publication.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: staging
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 97030c7d5fb1cc27b6464392511059317fc857d5
          path: work
          persist-credentials: false
      - name: Verify all original commit trees and publish only the feature branch
        working-directory: work
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ../staging/.github/gui-pr-publication/publish.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gui-pr-publication-ledger
          path: ${{ runner.temp }}/gui-pr-publication/publication.json
          retention-days: 7
          if-no-files-found: error
