name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ui:
    runs-on: windows-latest
    steps:
      # actions/checkout v4 backport line, 2026-07-16
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # actions/setup-node v4.4.0, 2025-04-02
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: npm run build

  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # actions/setup-python v5.6.0, 2025-04-24. 3.11.9 is the newest 3.11
      # patch with Windows binaries in the actions/python-versions manifest.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
      - run: python -m pip install --require-hashes -r requirements-lock.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: ruff check .
      - run: mypy uga apps
      - run: pytest
      - run: python -m apps.agent
      - run: python -m apps.example_game --headless-smoke
      - run: python -m apps.benchmark validate-config configs/benchmarks/uga-bench-smoke.yaml
      - run: python -m apps.dependency_inventory --require-known --output build/dependency-inventory.json
      - run: python -m build --no-isolation

  rust:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # dtolnay/rust-toolchain, 2026-09-03
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build -p uga-capture --locked

  # The python job cannot see the Rust build output, so native-boundary tests
  # silently skip there. This job builds the DLL against the committed lock
  # and makes its presence a hard precondition: missing DLL fails here
  # instead of quietly skipping anywhere.
  native-python-integration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # dtolnay/rust-toolchain, 2026-09-03
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.97.1
      - run: cargo build -p uga-capture --release --locked
        working-directory: native
      - name: Require the built DLL and export its pinned identity
        shell: pwsh
        run: |
          $dll = "native\target\release\uga_capture.dll"
          if (-not (Test-Path -LiteralPath $dll -PathType Leaf)) {
            Write-Error "native capture DLL was not produced at $dll"
            exit 1
          }
          $resolved = (Resolve-Path -LiteralPath $dll).Path
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $resolved).Hash.ToLowerInvariant()
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "UGA_NATIVE_CAPTURE_DLL=$resolved"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "UGA_NATIVE_CAPTURE_SHA256=$sha"
      # actions/setup-python v5.6.0, 2025-04-24. 3.11.9 is the newest 3.11
      # patch with Windows binaries in the actions/python-versions manifest.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
      - run: python -m pip install --require-hashes -r requirements-lock.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Native capture Python contract with -ra skip reasons
        run: pytest tests/windows/test_native_capture.py -q -ra
