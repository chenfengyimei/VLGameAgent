name: Validate staged hardening modules
on:
  push:
    branches: [automation/hardening-stage2-20260917]
    paths: ['.github/stage2/**', '.github/workflows/stage2-validate.yml']
permissions:
  contents: read
concurrency:
  group: stage2-hardening-validation
  cancel-in-progress: false
env:
  BASE_SHA: c4af90632865b4d8e758d6eabc84bd410ada38aa
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.bundle.outputs.commit }}
      tree: ${{ steps.bundle.outputs.tree }}
      digest: ${{ steps.bundle.outputs.digest }}
    defaults:
      run:
        working-directory: work
    steps:
      - name: Preserve source bytes
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: staging
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c4af90632865b4d8e758d6eabc84bd410ada38aa
          path: work
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - name: Authenticate and apply separate module commits
        run: python ../staging/.github/stage2/apply.py
      - run: python -m pip install --require-hashes -r requirements-lock.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - name: Apply only pinned native formatting as a separate commit
        working-directory: work/native
        run: |
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $changed = @(git diff --name-only)
          foreach ($path in $changed) {
            if ($path -notmatch '^native/.*\.rs$') { throw "Unexpected formatter change: $path" }
          }
          if ($changed.Count -gt 0) {
            git add --all
            git commit -m "style(native): normalize lifetime guards with Rust 1.97.1"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - run: ruff check .
      - run: mypy uga apps
      - run: cargo fmt --all --check
        working-directory: work/native
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        working-directory: work/native
      - run: cargo test --workspace --locked
        working-directory: work/native
      - run: cargo build -p uga-capture --release --locked
        working-directory: work/native
      - name: Require the newly built native DLL
        run: |
          $dll = (Resolve-Path -LiteralPath native/target/release/uga_capture.dll).Path
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $dll).Hash.ToLowerInvariant()
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "UGA_NATIVE_CAPTURE_DLL=$dll"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "UGA_NATIVE_CAPTURE_SHA256=$sha"
      - run: pytest -q -ra
      - run: python -m apps.agent
      - run: python -m apps.example_game --headless-smoke
      - run: python -m apps.benchmark validate-config configs/benchmarks/uga-bench-smoke.yaml
      - run: python -m apps.dependency_inventory --require-known --output build/dependency-inventory.json
      - run: python -m build --no-isolation
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.15.0'
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: npm run build
      - name: Seal exactly the validated commits
        id: bundle
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert not git('status', '--porcelain', '--untracked-files=no'), 'validation changed tracked files'
          output = pathlib.Path('../delivery-artifact')
          output.mkdir()
          commit, tree = git('rev-parse', 'HEAD'), git('rev-parse', 'HEAD^{tree}')
          subprocess.run(['git','bundle','create',str(output/'delivery.bundle'),os.environ['BASE_SHA']+'..refs/heads/delivery'],check=True)
          digest = hashlib.sha256((output/'delivery.bundle').read_bytes()).hexdigest()
          metadata = dict(commit=commit, tree=tree, digest=digest, base=os.environ['BASE_SHA'])
          (output/'verification.json').write_text(json.dumps(metadata, indent=2)+'\n')
          (output/'commits.txt').write_text(git('log','--reverse','--format=%H %s',os.environ['BASE_SHA']+'..HEAD')+'\n',encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
              for key in ('commit','tree','digest'):
                  stream.write(f'{key}={metadata[key]}\n')
          print(json.dumps(metadata))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-hardening-delivery
          path: delivery-artifact
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/complete-runtime-hardening-20260917
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-hardening-delivery
          path: ../verified-hardening
      - name: Verify bundle and fast-forward only the dedicated repair branch
        env:
          EXPECTED_COMMIT: ${{ needs.verify.outputs.commit }}
          EXPECTED_TREE: ${{ needs.verify.outputs.tree }}
          EXPECTED_DIGEST: ${{ needs.verify.outputs.digest }}
        shell: python
        run: |
          import hashlib, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()
          bundle=pathlib.Path('../verified-hardening/delivery.bundle').resolve()
          assert hashlib.sha256(bundle.read_bytes()).hexdigest()==os.environ['EXPECTED_DIGEST']
          assert git('rev-parse','HEAD')==os.environ['BASE_SHA'], 'repair branch changed; refusing overwrite'
          subprocess.run(['git','bundle','verify',str(bundle)],check=True)
          subprocess.run(['git','fetch',str(bundle),'refs/heads/delivery:refs/remotes/verified/delivery'],check=True)
          commit=git('rev-parse','refs/remotes/verified/delivery')
          assert commit==os.environ['EXPECTED_COMMIT']
          assert git('rev-parse',commit+'^{tree}')==os.environ['EXPECTED_TREE']
          subprocess.run(['git','merge-base','--is-ancestor',os.environ['BASE_SHA'],commit],check=True)
          subprocess.run(['git','push','origin',commit+':refs/heads/fix/complete-runtime-hardening-20260917'],check=True)
          print('Published verified module commits:',commit)
