name: Review dependencies
on:
  push:
    branches: [automation/review-workspace-20260917]
    paths: [.github/workflows/review-deps.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Stage binary wheels for offline tests
        run: |
          python -m pip download --only-binary=:all: --dest wheels ruff==0.16.6 mypy==2.3.1 pyarrow==25.0.1 av==18.1.0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: review-linux-test-wheels
          path: wheels
          retention-days: 1
          if-no-files-found: error
