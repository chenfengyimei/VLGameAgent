name: Verify final PR3 integration
on:
  push:
    branches: [automation/pr3-conflict-resolution-20260917]
    paths: [.github/workflows/pr3-final-verify.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a757fac7ac84c25834644e011b42c6326cd6bbf0
          persist-credentials: false
      - name: Require the final reviewed identity
        shell: python
        run: |
          import json, os, pathlib, subprocess
          head = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          tree = subprocess.check_output(['git','rev-parse','HEAD^{tree}'], text=True).strip()
          assert head == 'a757fac7ac84c25834644e011b42c6326cd6bbf0'
          assert tree == 'd0f94db0584265c579d3f4b2fe094f7bb7e0dfdc'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'final-identity.json').write_text(json.dumps({'commit':head,'tree':tree}))
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - run: python -m pip install --require-hashes -r requirements-lock.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: ruff check .
      - run: mypy uga apps
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - run: cargo fmt --all --check
        working-directory: native
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        working-directory: native
      - run: cargo test --workspace --locked
        working-directory: native
      - run: cargo build -p uga-capture --release --locked
        working-directory: native
      - name: Require the final revision's DLL
        run: |
          $dll = (Resolve-Path -LiteralPath native/target/release/uga_capture.dll).Path
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $dll).Hash.ToLowerInvariant()
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "UGA_NATIVE_CAPTURE_DLL=$dll"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "UGA_NATIVE_CAPTURE_SHA256=$sha"
      - name: Complete Python suite with native DLL
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          result = subprocess.run([sys.executable,'-m','pytest','-q','-ra','--junitxml=' + str(root / 'final-tests.xml')], stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          (root / 'final-pytest.log').write_bytes(result.stdout)
          print(result.stdout.decode('utf-8', errors='replace')[-12000:])
          raise SystemExit(result.returncode)
      - name: Repeat deterministic statistics test without sleeps
        shell: python
        run: |
          import unittest
          from tests.unit.test_capture_hub import CaptureHubTests
          suite = unittest.TestSuite(CaptureHubTests('test_gap_statistics_stay_bounded_over_long_runs') for _ in range(50))
          result = unittest.TextTestRunner(verbosity=1).run(suite)
          if not result.wasSuccessful():
              raise SystemExit(1)
      - run: python -m apps.agent
      - run: python -m apps.example_game --headless-smoke
      - run: python -m apps.benchmark validate-config configs/benchmarks/uga-bench-smoke.yaml
      - run: python -m apps.dependency_inventory --require-known --output build/dependency-inventory.json
      - run: python -m build --no-isolation
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.15.0'
      - name: Frontend install, typecheck and build
        shell: python
        run: |
          import os, pathlib, subprocess
          for name, args in [('ci',['ci','--include=dev']),('types',['run','typecheck']),('build',['run','build'])]:
              result = subprocess.run(['npm.cmd', *args], stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              pathlib.Path(os.environ['RUNNER_TEMP'], 'final-npm-' + name + '.log').write_bytes(result.stdout)
              print(result.stdout.decode('utf-8', errors='replace')[-2000:])
              if result.returncode:
                  raise SystemExit(result.returncode)
      - name: Export final revision evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr3-final-verification
          path: ${{ runner.temp }}/final-*
          retention-days: 7
          if-no-files-found: error
