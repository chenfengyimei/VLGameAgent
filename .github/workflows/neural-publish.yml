name: Publish verified neural objects
on:
  push:
    branches: [automation/neural-training-20260917]
    paths: [.github/workflows/neural-publish.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        working-directory: work
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: staging
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f279eea822b3f04f96fbca5dc3f5d6234607c3da
          path: work
          persist-credentials: false
      - name: Restore exact reviewed commits without executing project code
        run: python ../staging/.github/neural-delivery/apply.py
      - name: Check successful validations and publish only Git objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ../staging/.github/neural-delivery/publish.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: neural-published-object-ledger
          path: ${{ runner.temp }}/neural-published
          retention-days: 7
          if-no-files-found: error
