name: Validate and publish review fixes
on:
  push:
    branches: [automation/review-workspace-20260917]
    paths:
      - .github/workflows/review-apply.yml
      - .github/review/remediation.patch.xz.b64
permissions:
  contents: read
concurrency:
  group: review-fixes-20260917
  cancel-in-progress: false
env:
  BASE_SHA: a15d6d003dd95f59dec6ddd78fd5b930348fddc0
  PATCH_SHA256: 6e613c36771c90bbb338a9a172fbc91a21971bfb8dd6074ed1dee8b561e50522
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: work
    steps:
      - name: Preserve source line endings
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: staging
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a15d6d003dd95f59dec6ddd78fd5b930348fddc0
          path: work
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - name: Verify and apply the exact reviewed patch
        shell: python
        run: |
          import base64, hashlib, lzma, os, pathlib, subprocess
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == os.environ['BASE_SHA']
          encoded = pathlib.Path('../staging/.github/review/remediation.patch.xz.b64').read_text()
          patch = lzma.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == os.environ['PATCH_SHA256'], 'patch digest mismatch'
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'review.patch'
          target.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--unidiff-zero', str(target)], check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', str(target)], check=True)
      - run: python -m pip install --require-hashes -r requirements-lock.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: ruff check .
      - run: mypy uga apps
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - run: cargo fmt --all --check
        working-directory: work/native
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        working-directory: work/native
      - run: cargo test --workspace --locked
        working-directory: work/native
      - run: cargo build -p uga-capture --release --locked
        working-directory: work/native
      - name: Require native DLL for Python integration tests
        run: |
          $dll = (Resolve-Path -LiteralPath 'native/target/release/uga_capture.dll').Path
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $dll).Hash.ToLowerInvariant()
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "UGA_NATIVE_CAPTURE_DLL=$dll"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "UGA_NATIVE_CAPTURE_SHA256=$sha"
      - run: pytest -q -ra
      - run: python -m apps.agent
      - run: python -m apps.example_game --headless-smoke
      - run: python -m build --no-isolation
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.15.0'
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: npm run build
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    defaults:
      run:
        working-directory: work
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: staging
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a15d6d003dd95f59dec6ddd78fd5b930348fddc0
          path: work
          persist-credentials: false
      - name: Apply the verified patch without running repository code
        shell: python
        run: |
          import base64, hashlib, lzma, os, pathlib, subprocess
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == os.environ['BASE_SHA']
          encoded = pathlib.Path('../staging/.github/review/remediation.patch.xz.b64').read_text()
          patch = lzma.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == os.environ['PATCH_SHA256'], 'patch digest mismatch'
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'review.patch'
          target.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--unidiff-zero', str(target)], check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', str(target)], check=True)
      - name: Commit and fast-forward only the isolated repair branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target=refs/heads/fix/review-safety-data-20260917
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          current=$(git ls-remote origin "$target" | cut -f1)
          test "$current" = "$BASE_SHA" || { echo 'Repair branch advanced; refusing to overwrite it'; exit 1; }
          git add -A
          git diff --cached --check
          git config user.name 'OpenAI Assistant'
          git config user.email 'assistant@users.noreply.github.com'
          git commit -m 'fix(runtime): enforce fresh execution and causal training evidence'
          git push origin "HEAD:$target"
          echo "PUBLISHED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          git log -1 --format='%H %s'
