game:
  id: mumu-xianyu
  display_name: 仙遇 (MuMu 模拟器)
process:
  executable: [MuMuNxDevice.exe, MuMuPlayer.exe]
window:
  preferred_capture: windows_graphics_capture
  title_pattern: '^MuMu安卓设备-\d+$'
camera:
  type: absolute_pointer
planner:
  prompt_strategy: android_quest
perception:
  ocr_enabled: true
  ocr_languages: [ch, en]
  mode_hints:
    loading: [加载中, 正在加载, loading]
    gui: [设置, 确定, 取消, 返回]
    dead: [死亡, 重生, respawn]
  recovery_safe_actions: [back]
  # 实名登记/防沉迷是账号级法定门禁（含个人身份信息）：agent 绝不点击
  critical_action_terms: [登录, 删除, 支付, 发送, 安装, 充值, 首充, 实名, 防沉迷, 身份证, login, delete, pay, send, install]
  # MuMu 标题栏条带（窗口按钮/标签页）是模拟器 UI 不是游戏内容，禁止点击。
  # 标题栏定高约 45 物理像素：窗口高 740 时占 0.061，取 0.065 留出余量
  no_click_regions: [[0, 0, 1, 0.065]]
  page_stable_ms: 500
  action_effect_timeout_ms: 3000
controls:
  interact: {kind: mouse_button, code: "left", confirmed: true}
  menu: {kind: virtual_key, code: 27, confirmed: true}
  # 视觉返回控件：功能页左上角的卷云返回花纹（Esc 在本游戏不可靠，禁止作为返回）
  ui_back:
    kind: normalized_hotspot
    x: 0.060
    y: 0.080
    confirmed: true
  # 右上角关闭 X（OCR 读到 X 字形时自适应点击精确位置；此热点仅在 X 字形
  # 不可见时由恢复路径兜底，坐标偏下避开 MuMu 窗口自己的按钮行）
  ui_close:
    kind: normalized_hotspot
    x: 0.881
    y: 0.186
    confirmed: true
  # 境界页中央的晋升奖章（图形控件 OCR 读不出，规则层在目标全完成后点击）
  ui_promote:
    kind: normalized_hotspot
    x: 0.320
    y: 0.600
    confirmed: true
  # 剧情页左中 ``回顾剧情`` 仅是识别锚点，不能点击；右下为空白推进区。
  ui_dialogue_advance:
    kind: normalized_hotspot
    x: 0.960
    y: 0.915
    confirmed: true
  # 小青龙疗伤互动页：仅在“拯救重伤的小青龙”和“传功疗伤”同时识别时点击头部。
  ui_little_dragon_heal:
    kind: normalized_hotspot
    x: 0.568
    y: 0.588
    confirmed: true
  # 新手入侵战斗的右下群攻技能。技能图标/小字经常被特效遮挡，不能依赖
  # OCR 读到“群攻”；仅在任务文字与敌人姓名同时出现时由快速规则点击。
  ui_group_attack:
    kind: normalized_hotspot
    x: 0.770
    y: 0.890
    confirmed: true
  # 小青龙/灵宠的蓝色群攻技能（右侧上方）。仅在用户记录的魔化妖灵或
  # 桃木精战斗任务与敌人名称同时可见时点击。
  ui_pet_group_attack:
    kind: normalized_hotspot
    x: 0.950
    y: 0.500
    confirmed: true
  # 桃木精战斗中第二个紫色群攻技能；与上方灵宠群攻、下方群攻轮换。
  ui_secondary_group_attack:
    kind: normalized_hotspot
    x: 0.790
    y: 0.745
    confirmed: true
  # 幕后黑手 BOSS 战中的紫色治疗技能（加号图标），与三枚群攻技能轮换。
  ui_heal:
    kind: normalized_hotspot
    x: 0.840
    y: 0.635
    confirmed: true
  # 红尘入世第一段的底部 自动 开关：每个新角色只物理点击一次。
  ui_auto_combat:
    kind: normalized_hotspot
    x: 0.585
    y: 0.803
    confirmed: true
  # 契约之铃互动页：用户实测点击铃铛中央一次即可完成，无需按提示滑动。
  summon_bell_center:
    kind: normalized_hotspot
    x: 0.500
    y: 0.500
    confirmed: true
  # 桃天伴随教学：点击布阵页左侧当前主战灵宠卡，打开候选列表。
  pet_main_slot_card:
    kind: normalized_hotspot
    x: 0.135
    y: 0.430
    confirmed: true
  # 河洛城告示牌事件：先读左侧消息，出现洛神泪提示后再读右侧消息。
  notice_board_left_paper:
    kind: normalized_hotspot
    x: 0.395
    y: 0.550
    confirmed: true
  notice_board_right_paper:
    kind: normalized_hotspot
    x: 0.590
    y: 0.620
    confirmed: true
  dialogue_advance: {kind: virtual_key, code: 32, confirmed: true}
capabilities:
  realtime_3d: true
  gui: true
  combat: false
  gamepad: false
capability_level: 3
