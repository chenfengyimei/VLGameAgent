version: 1
game_id: mumu-xianyu
name: 仙遇初始主线（用户标注优先）
policy:
  decision_order: deterministic_rules_then_vision_model
  unknown_screen: vision_model_fallback
  keep_running: true
  notes:
    - 每次只执行一个动作，并在下一张稳定画面验证结果。
    - 热点仅能在完整页面锚点同时出现时使用，禁止跨页面套用。
    - 自动寻路期间只等待；战斗时优先群攻；对话中绝不点击回顾剧情。
